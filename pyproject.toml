[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coupled-oscillator-modal-lab"
version = "0.1.0"
description = "Normal modes, transient response, and vibration absorbers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23", "scipy>=1.10", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
